# Production stack for a single Linux VPS (Hostinger). See docs/DEPLOYMENT.md.
# All secrets come from .env next to this file (never committed).

name: data-intelligence

x-app-env: &app-env
  DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
  AUTH_SECRET: ${AUTH_SECRET}
  AUTH_URL: https://${DOMAIN}
  AUTH_TRUST_HOST: "true"
  CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-}
  ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
  FILES_DIR: /repo/data/files
  CLAMAV_HOST: ${CLAMAV_HOST:-}
  TZ: ${TZ:-Asia/Kolkata}

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--lower_case_table_names=1"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: &logging
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  migrate:
    build: { context: ., dockerfile: docker/worker.Dockerfile }
    image: data-intelligence/worker
    environment:
      <<: *app-env
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    entrypoint: ["sh", "/repo/docker/migrate.sh"]
    depends_on:
      mysql: { condition: service_healthy }
    restart: "no"

  web:
    build: { context: ., dockerfile: docker/web.Dockerfile }
    image: data-intelligence/web
    restart: unless-stopped
    environment: *app-env
    expose: ["3000"]
    volumes:
      - files_data:/repo/data/files
    depends_on:
      migrate: { condition: service_completed_successfully }
      mysql: { condition: service_healthy }
    logging: *logging

  worker:
    image: data-intelligence/worker
    restart: unless-stopped
    environment: *app-env
    # Chromium needs a larger /dev/shm than Docker's 64 MB default.
    shm_size: "1gb"
    init: true
    volumes:
      - files_data:/repo/data/files
    depends_on:
      migrate: { condition: service_completed_successfully }
    logging: *logging

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
      NGINX_ENVSUBST_FILTER: "^DOMAIN$$" # only ${DOMAIN} is substituted; nginx's own $vars are untouched
    volumes:
      # Point NGINX_TEMPLATES at ./docker/nginx/templates-http-only until the first certificate exists.
      - ${NGINX_TEMPLATES:-./docker/nginx/templates}:/etc/nginx/templates:ro
      - ./docker/nginx/snippets:/etc/nginx/snippets:ro
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt:ro
    depends_on: [web]
    logging: *logging

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    # Renewal loop; the first certificate is issued manually (see docs/DEPLOYMENT.md).
    entrypoint: ["sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"]
    restart: unless-stopped

  # Optional malware scanning of downloaded documents (~1 GB RAM). Enable with
  # COMPOSE_PROFILES=clamav and CLAMAV_HOST=clamav:3310 in .env; without it files are stored as "skipped".
  clamav:
    image: clamav/clamav:stable
    profiles: ["clamav"]
    restart: unless-stopped
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "1"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 180s
    logging: *logging

  backup:
    image: mysql:8.4
    restart: unless-stopped
    entrypoint: ["sh", "/backup.sh"]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_FILES_KEEP: ${BACKUP_FILES_KEEP:-4}
      FILES_DIR: /files
    volumes:
      - ./docker/backup.sh:/backup.sh:ro
      - ./backups:/backups
      - files_data:/files:ro
    depends_on:
      mysql: { condition: service_healthy }
    logging: *logging

volumes:
  mysql_data:
  files_data:
  clamav_data:
  certbot_www:
  certbot_conf:
